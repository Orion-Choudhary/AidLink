databases:
  - name: aidlink-db
    databaseName: aidlink_db
    user: aidlink_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: aidlink-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: ngo-backend
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aidlink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  - type: web
    name: aidlink-frontend
    runtime: static
    rootDir: ngo-platform
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aidlink-backend
          property: host
